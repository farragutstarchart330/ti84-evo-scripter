name: Validate Skill

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package
        run: python scripts/validate_skill.py .

      - name: Preflight (no browser on the runner -- must degrade, not fail)
        run: |
          python scripts/preflight.py --target evo-t
          python scripts/preflight.py --target evo-t --json

  behaviour:
    name: Checks on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the skill claims. 3.8 is EOL and setup-python no
        # longer provides it on ubuntu-latest, so claiming it would be a lie
        # CI could not check.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sandbox blocks desktop-only imports
        run: |
          if python scripts/simulate_ti84.py --program evals/fixtures/BADIMP.py \
               --target evo --json | grep -q "no module named 'statistics'"; then
            echo "import blocking works"
          else
            echo "::error::the constraint sandbox failed to block 'statistics'"
            exit 1
          fi

      - name: Refuse models without a Python App
        run: |
          for m in ce ce-t 84t 82advanced; do
            if python scripts/lint_ti_python.py examples/TIPCALC/TIPCALC.py \
                 --target "$m" 2>&1 | grep -q "has no Python App"; then
              echo "$m correctly refused"
            else
              echo "::error::target $m was not refused"
              exit 1
            fi
          done

      - name: Reject an illegal program name
        run: |
          cp examples/TIPCALC/TIPCALC.py /tmp/MyTipCalculator.py
          if python scripts/lint_ti_python.py /tmp/MyTipCalculator.py; then
            echo "::error::linter accepted an illegal AppVar name"
            exit 1
          fi
          echo "illegal name correctly rejected"

      - name: Gate the bundled example
        run: |
          python scripts/run_checks.py \
            --program examples/TIPCALC/TIPCALC.py \
            --tests examples/TIPCALC/tests.json \
            --target evo-t

      - name: Handout builds (HTML fallback, no browser on the runner)
        run: |
          python scripts/make_handout.py \
            --spec examples/TIPCALC/handout.json \
            --out /tmp/TIPCALC-handout.pdf
          test -s /tmp/TIPCALC-handout.html

  sandbox:
    name: Sandbox programs on every model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - evo
          - evo-t
          - ce-python
          - ce-t-python
          - 83pce-python
          - 82aep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate all five programs on ${{ matrix.target }}
        working-directory: sandbox
        run: |
          status=0
          for p in QUADRT TRISOLV STATS1 COMPINT KINEMAT; do
            echo "::group::$p on ${{ matrix.target }}"
            if python ../scripts/run_checks.py \
                 --program "$p/$p.py" \
                 --tests "$p/tests.json" \
                 --target "${{ matrix.target }}"; then
              echo "$p passed"
            else
              echo "::error file=sandbox/$p/$p.py::$p failed on ${{ matrix.target }}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
